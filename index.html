    <script>try{if(localStorage.dark==='1'||(localStorage.dark==null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <style>
      #boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;background:#f9fafb;color:#1a202c;font:700 28px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.02em}
      .dark #boot{background:#0f1419;color:#f1f5f9}
      #boot svg{width:96px;height:96px;overflow:visible}
      #boot .pin{fill:#0066cc;transform-origin:48px 76px;animation:drop .7s cubic-bezier(.34,1.56,.64,1) both}
      .dark #boot .pin{fill:#3b82f6}
      #boot .trail{fill:none;stroke:#0066cc;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 7;opacity:.55}
      .dark #boot .trail{stroke:#3b82f6}
      #boot .trail{animation:flow 1.2s linear infinite}
      #boot b{animation:fade .6s .35s ease-out both}
      @keyframes drop{from{transform:translateY(-28px) scale(.85);opacity:0}to{transform:none;opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-26}}
      @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
    </style>
