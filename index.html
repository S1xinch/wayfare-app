    <script>try{if(localStorage.dark==='1'||(localStorage.dark==null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <style>
      #boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;background:#f9fafb;color:#1a202c;font:700 28px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.02em}
      .dark #boot{background:#0f1419;color:#f1f5f9}
      #boot svg{width:96px;height:96px;overflow:visible}
      #boot .route{fill:none;stroke:#0066cc;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:150;stroke-dashoffset:150;animation:draw 1s .1s cubic-bezier(.65,0,.35,1) forwards}
      .dark #boot .route{stroke:#3b82f6}
      #boot .dot{fill:#f59e0b;transform-origin:82px 30px;animation:pop .5s 1s cubic-bezier(.34,1.56,.64,1) both}
      #boot b{animation:fade .8s .9s ease-out both}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pop{from{transform:scale(0)}to{transform:none}}
      @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
    </style>
